# Temporary scan stack: Jenkins with Gitleaks, Trivy, Semgrep and PMD.
# Works with `podman compose` (see compose.podman.yaml) and `docker compose`.
# :z relabels bind mounts on SELinux hosts (RHEL, Fedora) and is ignored elsewhere.
name: argus-scan

services:
  jenkins:
    build:
      context: ./image
      dockerfile: Containerfile
    image: localhost/argus-jenkins:dev
    restart: unless-stopped
    ports:
      - "127.0.0.1:${JENKINS_PORT:-8080}:8080"
    environment:
      JENKINS_ADMIN_ID: ${JENKINS_ADMIN_ID:-admin}
      JENKINS_ADMIN_PASSWORD: ${JENKINS_ADMIN_PASSWORD:?set JENKINS_ADMIN_PASSWORD in .env}
      JENKINS_PUBLIC_URL: http://localhost:${JENKINS_PORT:-8080}/
      ARGUS_REPORTS_DIR: /reports
      ARGUS_SOURCES_DIR: /sources
      MAVEN_MIRROR_URL: ${MAVEN_MIRROR_URL:-}
    volumes:
      - jenkins_home:/var/jenkins_home
      - ./argus:/opt/argus:ro,z
      - ${REPORTS_DIR:-./reports}:/reports:z
      - ${SOURCES_DIR:-./sources}:/sources:ro,z

volumes:
  jenkins_home:
